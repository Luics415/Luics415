name: Update profile visuals

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Generate stack and projects
        env:
          PROFILE_USER: Luics415
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile_assets.py
      - name: Commit generated visuals
        run: |
          if git diff --quiet -- assets/stack.svg assets/stack.gif assets/projects.svg assets/projects.gif; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stack.svg assets/stack.gif assets/projects.svg assets/projects.gif
          git commit -m "chore(profile): refresh repository visuals"
          git push
