name: Update profile visuals

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-profile-visuals
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install image dependency
        run: python -m pip install -r requirements.txt

      - name: Regenerate local profile assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_profile_assets.py --strict-refresh

      - name: Validate generated files
        run: python scripts/validate_profile_assets.py

      - name: Commit only when public data changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data/profile-snapshot.json docs/animation-system.md
          if git diff --cached --quiet; then
            echo "Profile visuals are already current."
          else
            git commit -m "chore(profile): refresh generated visuals"
            git push
          fi
